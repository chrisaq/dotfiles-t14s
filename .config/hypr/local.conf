################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
# monitor=,preferred,auto,auto
# Laptop panel fixed at origin
monitor = eDP-1,preferred,0x0,1

# Any other monitor: preferred mode, placed to the left of existing layout
monitor = ,preferred,auto-left,auto

# Workspaces → monitors
# Any external monitor (DP or HDMI) gets 1–4
workspace = 1, monitor:DP-*
workspace = 2, monitor:DP-*
workspace = 3, monitor:DP-*
workspace = 4, monitor:DP-*
workspace = 1, monitor:HDMI-*
workspace = 2, monitor:HDMI-*
workspace = 3, monitor:HDMI-*
workspace = 4, monitor:HDMI-*

# Laptop panel gets 5–9
workspace = 5, monitor:eDP-1
workspace = 6, monitor:eDP-1
workspace = 7, monitor:eDP-1
workspace = 8, monitor:eDP-1
workspace = 9, monitor:eDP-1

#############
### INPUT ###
#############

device {
    name = razer-razer-orochi
    sensitivity = -2.5
}

